<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>BennyBoy Downloads</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="./"><img src="favicon.svg" alt="" width="34" height="34"><span>Benny<b>Boy</b></span></a>
  <label class="search"><span id="i-search"></span><input id="q" type="search" placeholder="Search files" autocomplete="off" aria-label="Search files"></label>
</div></header>
<main class="wrap">
  <section class="hero"><h1>Fresh files, ready when you are.</h1><p id="summary">Loading…</p></section>
  <div class="tools">
    <nav id="chips" class="chips" aria-label="Categories"></nav>
    <div class="row">
      <select id="sort" aria-label="Sort files"><option value="new">Newest</option><option value="old">Oldest</option><option value="name">Name</option><option value="big">Largest</option><option value="small">Smallest</option></select>
      <button id="view" class="btn" aria-label="Switch layout"></button>
      <button id="select" class="btn">Select</button>
      <button id="all" class="btn primary" hidden><span></span></button>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden><p></p></div>
  <footer class="foot">
    <a class="brand" href="./"><img src="favicon.svg" alt="" width="26" height="26"><span>Benny<b>Boy</b></span></a>
    <p>Files are removed once they have been downloaded. Check back soon for more.</p>
    <p>&copy; <span id="yr"></span> BennyBoy. All rights reserved.</p>
  </footer>
</main>
<div id="bar" class="actionbar"><span id="bn"></span><button id="bdl" class="btn primary"></button><button id="bclr" class="btn">Clear</button></div>
<div id="modal" class="modal" hidden>
  <div class="sheet">
    <button id="mx" class="x" aria-label="Close"></button>
    <div id="stage" class="stage"></div>
    <h2 id="mt"></h2>
    <div id="ctl" class="ctl" hidden>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="btns"><button id="b10" aria-label="Back 10 seconds"></button><button id="bp" class="pp" aria-label="Play or pause"></button><button id="b5" aria-label="Forward 5 seconds"></button><button id="bfs" aria-label="Fullscreen"></button></div>
    </div>
    <a id="mdl" class="btn primary wide" download></a>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
